name: Build Windows

on:
  push:
    branches:
      - "0.10"
  pull_request:
    branches:
      - "0.10"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows x64 installer
    uses: ./.github/workflows/build-installers.yml
    permissions:
      contents: write
