name: Build Windows Installer

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up MSVC C++ build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=4.1,<5" "pyinstaller~=6.18" build wheel
          $cmakeBin = python -c "import cmake, pathlib; print(pathlib.Path(cmake.__file__).parent / 'data' / 'bin')"
          if (-not (Test-Path (Join-Path $cmakeBin "cmake.exe"))) {
            throw "Native CMake binary was not found."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBin
          $env:PATH = "$cmakeBin;$env:PATH"
          & (Join-Path $cmakeBin "cmake.exe") --version

      - name: Install NSIS
        uses: repolevedavaj/install-nsis@v1.2.0
        with:
          nsis-version: "3.11"

      - name: Build application wheel
        shell: pwsh
        env:
          BDISTWHEELFREEZELIBS: "true"
        run: python -m build

      - name: Install application dependencies and compile LevelDB for VS 2022
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          CMAKE_GENERATOR_PLATFORM: "x64"
        run: |
          $wheel = Get-ChildItem dist/amulet_map_editor-*.whl | Select-Object -First 1
          if (-not $wheel) { throw "Application wheel was not produced." }

          # Install the application and Python dependencies without invoking
          # the LevelDB native build. Its published setup.py hardcodes VS 2026.
          $env:AMULET_SKIP_COMPILE = "1"
          python -m pip install $wheel.FullName --upgrade
          if ($LASTEXITCODE -ne 0) { throw "Application dependency installation failed." }
          Remove-Item Env:AMULET_SKIP_COMPILE

          $leveldbVersion = python -c "from importlib.metadata import version; print(version('amulet-leveldb'))"
          if ($LASTEXITCODE -ne 0) { throw "Could not detect amulet-leveldb version." }

          $sourceRoot = Join-Path $env:RUNNER_TEMP "amulet-leveldb-source"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          python -m pip download --no-deps --no-binary=:all: --dest $sourceRoot "amulet-leveldb==$leveldbVersion"
          if ($LASTEXITCODE -ne 0) { throw "Could not download amulet-leveldb source." }

          $archive = Get-ChildItem $sourceRoot -File -Filter "*.tar.gz" | Select-Object -First 1
          if (-not $archive) { throw "The amulet-leveldb source archive was not found." }
          tar -xzf $archive.FullName -C $sourceRoot
          if ($LASTEXITCODE -ne 0) { throw "Could not extract amulet-leveldb source." }

          $source = Get-ChildItem $sourceRoot -Directory | Select-Object -First 1
          if (-not $source) { throw "The amulet-leveldb source directory was not found." }
          $setupPath = Join-Path $source.FullName "setup.py"
          $setupText = Get-Content $setupPath -Raw
          if (-not $setupText.Contains("Visual Studio 18 2026")) {
            throw "Expected VS 2026 generator was not found in this dependency version; refusing an unsafe patch."
          }
          $setupText = $setupText.Replace("Visual Studio 18 2026", "Visual Studio 17 2022")
          $setupText = $setupText.Replace('"v145"', '"v143"')
          Set-Content -Path $setupPath -Value $setupText -Encoding utf8

          if ((Get-Content $setupPath -Raw).Contains("Visual Studio 18 2026")) {
            throw "Failed to patch the LevelDB CMake generator."
          }

          python -m pip install --upgrade setuptools wheel versioneer packaging pybind11
          if ($LASTEXITCODE -ne 0) { throw "Could not install LevelDB build requirements." }

          Push-Location $source.FullName
          try {
            python -m pip install --no-build-isolation --no-deps .
            if ($LASTEXITCODE -ne 0) { throw "Patched amulet-leveldb failed to compile." }
          } finally {
            Pop-Location
          }

          python -c "import amulet.leveldb._leveldb; print('Amulet LevelDB native extension loaded successfully')"
          if ($LASTEXITCODE -ne 0) { throw "LevelDB native extension verification failed." }

      - name: Build PyInstaller bundle
        shell: pwsh
        run: |
          python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller bundle build failed." }
          if (-not (Test-Path "installer/dist/amulet/amulet.exe")) {
            throw "PyInstaller did not produce installer/dist/amulet/amulet.exe."
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            $version = python -c "import amulet_map_editor; print(amulet_map_editor.__version__)"
          } else {
            $version = $env:RELEASE_VERSION.TrimStart("v")
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}([a-zA-Z0-9.+-]*)?$') {
            throw "Invalid installer version: $version"
          }
          Push-Location installer
          try {
            makensis "/DVERSION=$version" "/DARCH=x64" windows.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS installer compilation failed." }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path "installer/dist/Amulet-$version-Windows-x64.exe")) {
            throw "NSIS installer was not created."
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amulet-Windows-x64
          path: installer/dist/Amulet-*-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach Windows installer to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: gh release upload "$env:GH_TAG" installer/dist/Amulet-*-Windows-x64.exe --clobber
