name: Build Windows Installer

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up MSVC C++ build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=4.1,<5" "pyinstaller~=6.18" build wheel
          $cmakeBin = python -c "import cmake, pathlib; print(pathlib.Path(cmake.__file__).parent / 'data' / 'bin')"
          if (-not (Test-Path (Join-Path $cmakeBin "cmake.exe"))) {
            throw "Native CMake binary was not found."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBin
          $env:PATH = "$cmakeBin;$env:PATH"
          & (Join-Path $cmakeBin "cmake.exe") --version

      - name: Install NSIS
        uses: repolevedavaj/install-nsis@v1.2.0
        with:
          nsis-version: "3.11"

      - name: Build application wheel
        shell: pwsh
        env:
          BDISTWHEELFREEZELIBS: "true"
        run: python -m build

      - name: Install application dependencies
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/amulet_map_editor-*.whl | Select-Object -First 1
          if (-not $wheel) { throw "Application wheel was not produced." }

          # amulet-leveldb 1.1.x is source-only on Python 3.11 and currently
          # requires a newer Visual Studio generator than the hosted runner.
          $constraints = Join-Path $env:RUNNER_TEMP "constraints.txt"
          Set-Content -Path $constraints -Value "amulet-leveldb==1.0.7"
          $env:PIP_CONSTRAINT = $constraints
          python -m pip install $wheel.FullName --upgrade
          if ($LASTEXITCODE -ne 0) { throw "Application dependency installation failed." }
          python -c "import amulet.leveldb._leveldb; print('Amulet LevelDB native extension loaded successfully')"
          if ($LASTEXITCODE -ne 0) { throw "LevelDB native extension verification failed." }

      - name: Build PyInstaller bundle
        shell: pwsh
        run: |
          python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller bundle build failed." }
          if (-not (Test-Path "installer/dist/amulet/amulet.exe")) {
            throw "PyInstaller did not produce installer/dist/amulet/amulet.exe."
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            $version = python -c "import amulet_map_editor; print(amulet_map_editor.__version__)"
          } else {
            $version = $env:RELEASE_VERSION.TrimStart("v")
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}([a-zA-Z0-9.+-]*)?$') {
            throw "Invalid installer version: $version"
          }
          Push-Location installer
          try {
            makensis "/DVERSION=$version" "/DARCH=x64" windows.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS installer compilation failed." }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path "installer/dist/Amulet-$version-Windows-x64.exe")) {
            throw "NSIS installer was not created."
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amulet-Windows-x64
          path: installer/dist/Amulet-*-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach Windows installer to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: gh release upload "$env:GH_TAG" installer/dist/Amulet-*-Windows-x64.exe --clobber
